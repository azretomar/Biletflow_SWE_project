name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # A throwaway database so the *_DB tests and the full flow test run too.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: biletflow
          POSTGRES_PASSWORD: biletflow
          POSTGRES_DB: biletflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biletflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://biletflow:biletflow@localhost:5432/biletflow_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t biletflow-backend ./backend
      - run: docker build -t biletflow-frontend ./frontend
