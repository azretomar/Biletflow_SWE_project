services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: biletflow
      POSTGRES_PASSWORD: biletflow
      POSTGRES_DB: biletflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biletflow -d biletflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      # Inside the compose network the database host is `db`, not localhost.
      DATABASE_URL: postgres://biletflow:biletflow@db:5432/biletflow?sslmode=disable
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
